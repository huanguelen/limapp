<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LIMA">
  <meta name="theme-color" content="#1a1d3a">
  <title>Lima FC · Ranking Prode</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:          #0b0e1f;
      --surface:     #111426;
      --surface-2:   #161a30;
      --surface-3:   #1c2140;
      --border:      #1e2444;
      --border-2:    #252c50;
      --blue:        #2E3092;
      --cyan:        #00AEEF;
      --cyan-dim:    rgba(0,174,239,0.15);
      --cyan-glow:   rgba(0,174,239,0.35);
      --text:        #edf0ff;
      --text-2:      #8a93bc;
      --text-3:      #6b7599;
      --win:         #4ade80;
      --draw:        #facc15;
      --loss:        #f87171;
      --gold:        #fbbf24;
      --silver:      #94a3b8;
      --bronze:      #d97706;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bot:    env(safe-area-inset-bottom, 0px);
      --nav-h:       72px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Barlow Condensed", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--nav-h) + var(--safe-bot));
    }

    /* ── HEADER ── */
    header {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      min-height: 56px; overflow: hidden;
      background: linear-gradient(180deg, #070a18 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }
    header::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% -10%, rgba(0,174,239,.18) 0%, transparent 65%);
      pointer-events: none;
    }
    header::after {
      content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: .5;
    }
    .header-back {
      background: none; border: none; color: var(--cyan);
      font-size: 22px; cursor: pointer; padding: 8px;
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1; transition: transform .15s; text-decoration: none;
    }
    .header-back:active { transform: scale(.9); }
    .header-title {
      font-family: "Bebas Neue", sans-serif; font-size: 20px;
      letter-spacing: 4px; color: #fff;
      text-shadow: 0 0 20px rgba(0,174,239,.2);
      position: relative; z-index: 1;
    }

    /* ── PAGE ── */
    .ranking-content {
      max-width: 600px; margin: 0 auto; padding: 16px;
    }
    .ranking-header { text-align: center; margin-bottom: 24px; }
    .ranking-title {
      font-family: "Bebas Neue", sans-serif; font-size: 28px;
      color: var(--cyan); letter-spacing: 4px;
    }
    .ranking-subtitle {
      font-size: 11px; color: var(--text-3); letter-spacing: 1.5px;
      margin-top: 4px; font-family: "Inter", system-ui, sans-serif;
    }

    /* ── PODIUM ── */
    .podium {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 10px; margin-bottom: 28px; padding: 0 8px;
    }
    .podium-slot {
      display: flex; flex-direction: column; align-items: center;
      flex: 1; max-width: 140px;
    }
    .podium-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 8px;
      position: relative; overflow: hidden;
    }
    .podium-avatar img {
      width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
    }
    .podium-slot.first .podium-avatar {
      width: 72px; height: 72px; font-size: 30px;
      box-shadow: 0 0 24px rgba(251,191,36,.35);
    }
    .podium-medal {
      position: absolute; bottom: -4px; right: -4px;
      font-size: 18px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
    }
    .podium-name {
      font-family: "Bebas Neue", sans-serif; font-size: 17px;
      letter-spacing: 2px; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }
    .podium-points {
      font-family: "Inter", system-ui, sans-serif; font-size: 12px;
      margin-top: 2px; letter-spacing: .5px;
    }
    .podium-bar {
      width: 100%; border-radius: 8px 8px 0 0;
      margin-top: 8px; min-height: 20px;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 6px;
    }
    .podium-rank {
      font-family: "Bebas Neue", sans-serif; font-size: 22px;
      letter-spacing: 2px; color: rgba(0,0,0,.5);
    }

    /* 1st */
    .podium-slot.first .podium-avatar { background: linear-gradient(135deg, #fbbf24, #f59e0b); border: 3px solid #fbbf24; }
    .podium-slot.first .podium-name { color: var(--gold); }
    .podium-slot.first .podium-points { color: var(--gold); }
    .podium-slot.first .podium-bar { background: linear-gradient(180deg, #fbbf24, #b45309); height: 100px; }

    /* 2nd */
    .podium-slot.second .podium-avatar { background: linear-gradient(135deg, #94a3b8, #64748b); border: 3px solid #94a3b8; }
    .podium-slot.second .podium-name { color: var(--silver); }
    .podium-slot.second .podium-points { color: var(--silver); }
    .podium-slot.second .podium-bar { background: linear-gradient(180deg, #94a3b8, #475569); height: 72px; }

    /* 3rd */
    .podium-slot.third .podium-avatar { background: linear-gradient(135deg, #d97706, #92400e); border: 3px solid #d97706; }
    .podium-slot.third .podium-name { color: var(--bronze); }
    .podium-slot.third .podium-points { color: var(--bronze); }
    .podium-slot.third .podium-bar { background: linear-gradient(180deg, #d97706, #78350f); height: 52px; }

    /* ── REST LIST ── */
    .rank-list { display: flex; flex-direction: column; gap: 6px; }
    .rank-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; transition: background .2s;
    }
    .rank-pos {
      font-family: "Bebas Neue", sans-serif; font-size: 16px;
      letter-spacing: 2px; color: var(--text-3);
      min-width: 28px; text-align: center;
    }
    .rank-avatar-sm {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--surface-3); border: 2px solid var(--border-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0; overflow: hidden;
    }
    .rank-avatar-sm img {
      width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
    }
    .rank-name {
      font-family: "Bebas Neue", sans-serif; font-size: 15px;
      letter-spacing: 1.5px; color: var(--text);
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rank-pts {
      font-family: "Inter", system-ui, sans-serif; font-size: 13px;
      color: var(--cyan); font-weight: 600;
      letter-spacing: .5px; flex-shrink: 0;
    }
    .rank-pts-label {
      font-size: 10px; color: var(--text-3); font-weight: 400;
      margin-left: 2px; letter-spacing: 1px;
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      display: flex; align-items: center;
      background: var(--bg);
      border-top: 1px solid rgba(0,174,239,.12);
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 50; height: var(--nav-h);
      padding: 10px 12px;
      padding-bottom: calc(10px + var(--safe-bot));
      gap: 8px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .bottom-nav::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg,
        transparent 0%, rgba(0,174,239,.3) 30%, rgba(0,174,239,.5) 50%, rgba(0,174,239,.3) 70%, transparent 100%);
    }
    .nav-tab {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 5px; font-family: "Bebas Neue", sans-serif;
      font-size: 11px; letter-spacing: 2px; cursor: pointer;
      border-radius: 14px; padding: 10px 8px; min-height: 52px;
      transition: all .22s cubic-bezier(.4,0,.2,1);
      position: relative; overflow: hidden;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
      color: var(--text-3); text-decoration: none;
    }
    .nav-tab:active { transform: scale(.96); }
    .nav-tab.active {
      background: linear-gradient(145deg, var(--blue) 0%, #1a1e5a 60%, #0e1040 100%);
      border: 1px solid rgba(0,174,239,.45); color: var(--cyan);
      box-shadow: 0 0 18px rgba(0,174,239,.18), 0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .nav-tab.active::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% -10%, rgba(0,174,239,.2) 0%, transparent 65%);
      pointer-events: none;
    }
    .nav-icon-svg {
      width: 22px; height: 22px; position: relative; z-index: 1;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), stroke .22s;
    }
    .nav-tab.active .nav-icon-svg {
      transform: scale(1.08);
      filter: drop-shadow(0 0 4px rgba(0,174,239,.5));
    }
    .nav-tab span { position: relative; z-index: 1; }

    /* ── FECHAS CONTAINER ── */
    .fechas-box {
      position: fixed; left: 8px; top: 50%; transform: translateY(-50%);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 8px;
      z-index: 40; width: 62px;
    }
    .fechas-box-title {
      font-family: "Bebas Neue", sans-serif; font-size: 10px;
      letter-spacing: 2px; color: var(--text-3); margin-bottom: 8px;
      text-align: center;
    }
    .fechas-grid {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px;
    }
    .fecha-pill {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(145deg, var(--surface-2), var(--surface-3));
      border: 1.5px solid var(--cyan);
      display: flex; align-items: center; justify-content: center;
      font-family: "Bebas Neue", sans-serif; font-size: 13px;
      letter-spacing: 1px; color: var(--cyan);
      cursor: pointer; transition: all .2s;
      position: relative;
      box-shadow: 0 0 8px rgba(0,174,239,.15), 0 2px 6px rgba(0,0,0,.3);
    }
    .fecha-pill:active { transform: scale(.9); }
    .fecha-pill:hover {
      background: linear-gradient(145deg, var(--blue), #1a1e5a);
      border-color: var(--cyan); color: #fff;
      box-shadow: 0 0 14px rgba(0,174,239,.35), 0 2px 8px rgba(0,0,0,.4);
    }
    .fecha-pill.has-scores {
      background: linear-gradient(145deg, var(--blue), #1a1e5a);
      border-color: var(--cyan); color: #fff;
      box-shadow: 0 0 12px rgba(0,174,239,.3), 0 2px 8px rgba(0,0,0,.4);
    }
    .fecha-pill .pill-dot {
      position: absolute; top: 1px; right: 1px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--win); display: none;
      box-shadow: 0 0 6px rgba(74,222,128,.6);
    }
    .fecha-pill.has-scores .pill-dot { display: block; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.7);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--surface); border: 1px solid var(--border-2);
      border-radius: 14px; width: 100%; max-width: 380px;
      max-height: 80vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 30px rgba(0,174,239,.1);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 18px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title {
      font-family: "Bebas Neue", sans-serif; font-size: 20px;
      letter-spacing: 3px; color: var(--cyan);
    }
    .modal-close {
      background: none; border: none; color: var(--text-3);
      font-size: 22px; cursor: pointer; padding: 4px 8px;
      line-height: 1; transition: color .2s;
    }
    .modal-close:hover { color: var(--loss); }
    .modal-stats {
      display: flex; gap: 12px; padding: 12px 18px;
      border-bottom: 1px solid var(--border);
    }
    .modal-stat {
      flex: 1; text-align: center;
    }
    .modal-stat-val {
      font-family: "Bebas Neue", sans-serif; font-size: 22px;
      letter-spacing: 2px;
    }
    .modal-stat-val.ok { color: var(--win); }
    .modal-stat-val.pending { color: var(--draw); }
    .modal-stat-label {
      font-family: "Inter", system-ui, sans-serif; font-size: 10px;
      letter-spacing: 1px; color: var(--text-3); margin-top: 2px;
    }
    .modal-body {
      flex: 1; overflow-y: auto; padding: 10px 14px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .modal-rank-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      transition: background .15s;
    }
    .modal-rank-row:nth-child(odd) { background: rgba(255,255,255,.02); }
    .modal-rank-pos {
      font-family: "Bebas Neue", sans-serif; font-size: 14px;
      color: var(--text-3); min-width: 24px; text-align: center;
    }
    .modal-rank-name {
      font-family: "Bebas Neue", sans-serif; font-size: 14px;
      letter-spacing: 1.5px; color: var(--text);
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-rank-pts {
      font-family: "Inter", system-ui, sans-serif; font-size: 13px;
      color: var(--cyan); font-weight: 600; flex-shrink: 0;
    }
    .modal-empty {
      text-align: center; color: var(--text-3); padding: 24px;
      font-family: "Inter", system-ui, sans-serif; font-size: 13px;
    }

    /* ── EVOLUTION CHART ── */
    .ranking-title-row {
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-chart {
      background: none; border: 1px solid rgba(0,174,239,.3);
      color: var(--cyan); border-radius: 8px; padding: 6px 10px;
      cursor: pointer; transition: all .2s; display: flex; align-items: center;
    }
    .btn-chart:active { transform: scale(.92); }
    .btn-chart:hover { background: rgba(0,174,239,.1); border-color: var(--cyan); }
    .btn-chart svg { width: 20px; height: 20px; }
    .chart-overlay {
      position: fixed; inset: 0; z-index: 110;
      background: rgba(0,0,0,.85);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .chart-overlay.open { opacity: 1; pointer-events: auto; }
    .chart-card {
      background: var(--surface); border: 1px solid var(--border-2);
      border-radius: 14px; width: 100%; max-width: 700px;
      max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 30px rgba(0,174,239,.1);
      overflow: hidden;
    }
    .chart-header {
      padding: 14px 18px 10px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .chart-title {
      font-family: "Bebas Neue", sans-serif; font-size: 18px;
      letter-spacing: 3px; color: var(--cyan);
    }
    .chart-close {
      background: none; border: none; color: var(--text-3);
      font-size: 22px; cursor: pointer; padding: 4px 8px;
      line-height: 1; transition: color .2s;
    }
    .chart-close:hover { color: var(--loss); }
    .chart-body {
      flex: 1; overflow: auto; padding: 16px;
      display: flex; flex-direction: column; align-items: center;
    }
    .chart-canvas {
      width: 100%; max-width: 660px; height: 320px;
      background: var(--surface-2); border-radius: 8px;
    }
    .chart-legend {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px;
      justify-content: center;
    }
    .chart-legend-item {
      display: flex; align-items: center; gap: 5px;
      font-family: "Inter", system-ui, sans-serif; font-size: 11px;
      color: var(--text-2); cursor: pointer; padding: 3px 8px;
      border-radius: 6px; transition: all .2s;
      border: 1px solid transparent;
    }
    .chart-legend-item:hover { background: rgba(255,255,255,.05); }
    .chart-legend-item.active {
      background: rgba(0,174,239,.12); border-color: rgba(0,174,239,.3);
      color: #fff;
    }
    .chart-legend-item.dimmed { opacity: .35; }
    .chart-legend-color {
      width: 14px; height: 4px; border-radius: 2px;
    }
  </style>
</head>

<body>

<header>
  <a href="/prode.html" class="header-back" aria-label="Volver">←</a>
  <span class="header-title">LIMA FC</span>
</header>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">FECHA 1</span>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-stats" id="modalStats"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Chart overlay -->
<div class="chart-overlay" id="chartOverlay">
  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">📈 EVOLUCIÓN DE PUNTAJES</span>
      <button class="chart-close" id="chartClose">&times;</button>
    </div>
    <div class="chart-body">
      <canvas class="chart-canvas" id="chartCanvas"></canvas>
      <div class="chart-legend" id="chartLegend"></div>
    </div>
  </div>
</div>

<!-- Fechas sidebar -->
<div class="fechas-box" id="fechasBox" style="display:none">
  <div class="fechas-box-title">⚽ FECHAS</div>
  <div class="fechas-grid" id="fechaSidebar"></div>
</div>

<div class="ranking-content">
  <div class="ranking-header">
    <div class="ranking-title-row">
      <div class="ranking-title">🏆 RANKING PRODE</div>
      <button class="btn-chart" id="btnChart" title="Evolución de puntajes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </button>
    </div>
    <div class="ranking-subtitle">POSICIONES ACUMULADAS · JUNIOR APERTURA 2026</div>
  </div>

  <!-- Podium top 3 -->
  <div class="podium" id="podium"></div>

  <!-- 4th onwards -->
  <div class="rank-list" id="rankList"></div>
</div>

<!-- ── BOTTOM NAV ── -->
<nav class="bottom-nav">
  <a class="nav-tab" href="/">
    <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4h4v4a1 1 0 001 1h3a1 1 0 001-1V10"/>
    </svg>
    <span>INICIO</span>
  </a>
  <a class="nav-tab" href="/prode.html">
    <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <line x1="12" y1="4" x2="12" y2="20"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
      <circle cx="7" cy="8" r="1.5"/>
      <circle cx="17" cy="16" r="1.5"/>
    </svg>
    <span>PRODE</span>
  </a>
  <a class="nav-tab active" href="/prode-ranking.html">
    <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/>
    </svg>
    <span>RANKING</span>
  </a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { initializeAuth, onAuthStateChanged, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { USE_MOCK, firebaseConfig } from "./config.js";

let _scoringData = null;
let _fechasData = null;

const INITIALS_EMOJI = [
  "⚽","🦁","🔥","💪","🎯","⭐","🏅","👑","🐺","🦅",
  "🎖️","💎","🚀","🐆","🤙","🏆","⚡","🎲","🥅","🧤",
  "🦾","🫡","🎽","🛡️"
];

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// Abbreviate fecha name for pills: "Octogonal partido 1" → "OP1", "3" → "F3"
function abreviarFecha(key) {
  if (/^\d+$/.test(key)) return "F" + key;
  return key.split(/\s+/).map(w => w[0]).join("").toUpperCase();
}

function formatName(email) {
  if (!email) return "";
  if (!email.includes("@")) return email;
  const local = email.split("@")[0].replace(/[._]/g, " ");
  // Capitalize first letter of each word
  return local.replace(/\b\w/g, c => c.toUpperCase());
}

function render(ranking) {
  const podiumEl = document.getElementById("podium");
  const listEl = document.getElementById("rankList");

  if (!ranking || ranking.length === 0) {
    podiumEl.innerHTML = "";
    listEl.innerHTML = '<div style="text-align:center;color:var(--text-3);padding:40px;font-family:Inter,sans-serif;font-size:14px">Sin datos de ranking aún.<br>El admin debe calcular puntajes primero.</div>';
    return;
  }

  // Podium slots
  const slots = [
    { cls: "first", medal: "🥇", rank: "1°" },
    { cls: "second", medal: "🥈", rank: "2°" },
    { cls: "third", medal: "🥉", rank: "3°" },
  ];
  // Visual order: 2nd, 1st, 3rd
  const podiumOrder = [1, 0, 2];
  let podiumHtml = "";
  for (const idx of podiumOrder) {
    if (idx < ranking.length) {
      const r = ranking[idx];
      const s = slots[idx];
      podiumHtml += `
        <div class="podium-slot ${s.cls}">
          <div class="podium-avatar">${r.avatarHtml}<span class="podium-medal">${s.medal}</span></div>
          <div class="podium-name">${esc(r.name)}</div>
          <div class="podium-points">${r.pts} pts</div>
          <div class="podium-bar"><span class="podium-rank">${s.rank}</span></div>
        </div>`;
    }
  }
  podiumEl.innerHTML = podiumHtml;

  // Rest: after podium
  const startIdx = Math.min(3, ranking.length);
  let html = "";
  for (let i = startIdx; i < ranking.length; i++) {
    const r = ranking[i];
    html += `
      <div class="rank-row">
        <span class="rank-pos">${i + 1}°</span>
        <div class="rank-avatar-sm">${r.avatarHtml}</div>
        <span class="rank-name">${esc(r.name)}</span>
        <span class="rank-pts">${r.pts}<span class="rank-pts-label"> PTS</span></span>
      </div>`;
  }
  listEl.innerHTML = html;
}

async function loadRanking() {
  if (USE_MOCK) {
    render([
      { name: "Jugador Demo", pts: 10, emoji: "⚽", avatarHtml: "⚽" },
      { name: "Jugador 2", pts: 7, emoji: "🦁", avatarHtml: "🦁" },
      { name: "Jugador 3", pts: 5, emoji: "🔥", avatarHtml: "🔥" },
    ]);
    return;
  }

  try {
    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    // initializeAuth with session persistence so tokens from prode.html are found
    const auth = initializeAuth(fbApp, {
      persistence: browserSessionPersistence
    });

    // Wait for auth state to be restored
    await new Promise((resolve) => {
      const unsub = onAuthStateChanged(auth, () => { unsub(); resolve(); });
    });

    // Read scoring, usuarios, and fechas — some may fail without auth
    const [scoringResult, usersResult, fechasResult] = await Promise.allSettled([
      get(ref(db, "lima/prode/scoring")),
      get(ref(db, "lima/usuarios")),
      get(ref(db, "lima/prode/fechas"))
    ]);

    if (scoringResult.status === "rejected") {
      console.warn("Could not read scoring:", scoringResult.reason);
      render([]);
      return;
    }

    const scoringData = scoringResult.value.val();
    if (!scoringData) { render([]); return; }
    _scoringData = scoringData;

    // Store fechas data for sidebar
    if (fechasResult.status === "fulfilled") {
      _fechasData = fechasResult.value.val() || {};
    }

    // Build avatar map only if usuarios loaded successfully
    const avatarMap = {};
    if (usersResult.status === "fulfilled") {
      const usersData = usersResult.value.val() || {};
      for (const u of Object.values(usersData)) {
        if (u.email && u.avatar) avatarMap[u.email.toLowerCase()] = u.avatar;
      }
    }

    // 2. Build ranking array from scoring data (email is stored in scoring)
    const ranking = [];
    let emojiIdx = 0;
    for (const [uid, data] of Object.entries(scoringData)) {
      const name = data.nombre || formatName(data.email) || uid.substring(0, 12) + "...";
      const emoji = INITIALS_EMOJI[emojiIdx % INITIALS_EMOJI.length];
      const userAvatar = data.email ? avatarMap[data.email.toLowerCase()] : null;
      emojiIdx++;

      // Sum total from all fechas
      let totalPts = 0, totalAciertos = 0, totalExactos = 0;
      if (data.fechas) {
        for (const f of Object.values(data.fechas)) {
          totalPts += f.puntos || 0;
          totalAciertos += f.aciertos || 0;
          totalExactos += f.exactos || 0;
        }
      }

      const avatarHtml = userAvatar
        ? `<img src="/images/${esc(userAvatar)}" alt="">`
        : emoji;

      ranking.push({
        name,
        pts: data.total || totalPts,
        aciertos: totalAciertos,
        exactos: totalExactos,
        emoji,
        avatarHtml
      });
    }

    // Sort by points descending, then by exactos descending as tiebreaker
    ranking.sort((a, b) => b.pts - a.pts || b.exactos - a.exactos || b.aciertos - a.aciertos);

    render(ranking);
    renderFechaSidebar();
  } catch (e) {
    console.error("Error loading ranking:", e);
    document.getElementById("rankList").innerHTML = '<div style="text-align:center;color:var(--text-3);padding:40px;font-family:Inter,sans-serif;font-size:14px">Nada que ver por aqu\u00ed a\u00fan\u2026<br>aprovech\u00e1 para entrenar! \u26bd</div>';
  }
}

// ═══════════════════════════════════════════
// FECHA SIDEBAR + MODAL
// ═══════════════════════════════════════════
function renderFechaSidebar() {
  const container = document.getElementById("fechaSidebar");
  const box = document.getElementById("fechasBox");
  if (!_fechasData || Object.keys(_fechasData).length === 0) {
    container.innerHTML = "";
    box.style.display = "none";
    return;
  }

  const sorted = Object.entries(_fechasData).sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true, sensitivity: 'base' }));
  let html = "";
  for (const [key, fecha] of sorted) {
    let hasScores = false;
    if (_scoringData) {
      for (const d of Object.values(_scoringData)) {
        if (d.fechas && d.fechas[key]) { hasScores = true; break; }
      }
    }
    html += `<button class="fecha-pill ${hasScores ? 'has-scores' : ''}" data-fecha="${esc(key)}" title="Fecha ${esc(key)}">
      ${esc(abreviarFecha(key))}<span class="pill-dot"></span>
    </button>`;
  }
  container.innerHTML = html;
  box.style.display = "";

  // Click handlers
  container.querySelectorAll(".fecha-pill").forEach(btn => {
    btn.addEventListener("click", () => openFechaModal(btn.dataset.fecha));
  });
}

function openFechaModal(fechaKey) {
  const overlay = document.getElementById("modalOverlay");
  const fecha = _fechasData && _fechasData[fechaKey];

  document.getElementById("modalTitle").textContent = `FECHA ${fechaKey}`;

  // Stats: partidos finalizados / pendientes
  let total = 0, played = 0;
  if (fecha && fecha.groups) {
    for (const g of fecha.groups) {
      for (const m of g.matches) {
        total++;
        if (m.homeScore != null && m.awayScore != null) played++;
      }
    }
  }
  const pending = total - played;
  document.getElementById("modalStats").innerHTML = `
    <div class="modal-stat">
      <div class="modal-stat-val ok">${played}</div>
      <div class="modal-stat-label">FINALIZADOS</div>
    </div>
    <div class="modal-stat">
      <div class="modal-stat-val pending">${pending}</div>
      <div class="modal-stat-label">PENDIENTES</div>
    </div>
    <div class="modal-stat">
      <div class="modal-stat-val" style="color:var(--text-2)">${total}</div>
      <div class="modal-stat-label">TOTAL</div>
    </div>`;

  // Ranking for this fecha
  const body = document.getElementById("modalBody");
  if (!_scoringData) {
    body.innerHTML = '<div class="modal-empty">Sin puntajes calculados para esta fecha</div>';
  } else {
    const entries = [];
    for (const [uid, data] of Object.entries(_scoringData)) {
      if (!data.fechas || !data.fechas[fechaKey]) continue;
      const f = data.fechas[fechaKey];
      entries.push({
        name: data.nombre || formatName(data.email) || uid.substring(0, 12) + "...",
        puntos: f.puntos || 0,
        aciertos: f.aciertos || 0,
        exactos: f.exactos || 0
      });
    }
    entries.sort((a, b) => b.puntos - a.puntos || b.exactos - a.exactos || b.aciertos - a.aciertos);

    if (entries.length === 0) {
      body.innerHTML = '<div class="modal-empty">Sin puntajes calculados para esta fecha</div>';
    } else {
      let html = "";
      entries.forEach((e, i) => {
        html += `<div class="modal-rank-row">
          <span class="modal-rank-pos">${i + 1}°</span>
          <span class="modal-rank-name">${esc(e.name)}</span>
          <span class="modal-rank-pts">${e.puntos} pts</span>
        </div>`;
      });
      body.innerHTML = html;
    }
  }

  overlay.classList.add("open");
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// ═══════════════════════════════════════════
// EVOLUTION CHART
// ═══════════════════════════════════════════
const CHART_COLORS = [
  "#00AEEF", "#4ade80", "#fbbf24", "#f87171", "#a78bfa",
  "#fb923c", "#38bdf8", "#e879f9", "#34d399", "#f472b6",
  "#ef4444", "#06b6d4", "#84cc16", "#ec4899", "#8b5cf6",
  "#14b8a6", "#f59e0b", "#6366f1", "#10b981", "#e11d48",
  "#0ea5e9", "#d946ef"
];

let _chartSeries = [];
let _chartFechaKeys = [];
let _highlightIdx = -1; // -1 = none highlighted (show all)

function openChart() {
  if (!_scoringData || !_fechasData) return;
  _highlightIdx = -1;
  const overlay = document.getElementById("chartOverlay");
  overlay.classList.add("open");
  buildChartData();
  drawChart();
}

function closeChart() {
  document.getElementById("chartOverlay").classList.remove("open");
}

function buildChartData() {
  _chartFechaKeys = Object.keys(_fechasData).sort((a, b) =>
    a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
  );

  _chartSeries = [];
  for (const [uid, data] of Object.entries(_scoringData)) {
    const name = data.nombre || formatName(data.email) || uid.substring(0, 12);
    const points = [];
    let cumulative = 0;
    for (const key of _chartFechaKeys) {
      if (data.fechas && data.fechas[key]) {
        cumulative += data.fechas[key].puntos || 0;
      }
      points.push(cumulative);
    }
    _chartSeries.push({ name, points });
  }
  // Sort by final score descending
  _chartSeries.sort((a, b) => b.points[b.points.length - 1] - a.points[a.points.length - 1]);
}

function drawChart() {
  const canvas = document.getElementById("chartCanvas");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;

  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;

  const fechaKeys = _chartFechaKeys;
  const series = _chartSeries;
  if (fechaKeys.length === 0) return;

  const ml = 40, mr = 16, mt = 20, mb = 50;
  const cw = W - ml - mr;
  const ch = H - mt - mb;
  const maxVal = Math.max(1, ...series.map(s => Math.max(...s.points)));

  ctx.clearRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = "rgba(255,255,255,.06)";
  ctx.lineWidth = 1;
  const gridLines = 5;
  for (let i = 0; i <= gridLines; i++) {
    const y = mt + ch - (ch * i / gridLines);
    ctx.beginPath(); ctx.moveTo(ml, y); ctx.lineTo(W - mr, y); ctx.stroke();
    ctx.fillStyle = "#6b7599";
    ctx.font = "11px Inter, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(Math.round(maxVal * i / gridLines), ml - 6, y + 4);
  }

  // X labels
  ctx.textAlign = "center";
  ctx.fillStyle = "#6b7599";
  ctx.font = "10px 'Bebas Neue', sans-serif";
  for (let i = 0; i < fechaKeys.length; i++) {
    const x = ml + (cw * i / (Math.max(1, fechaKeys.length - 1)));
    ctx.save();
    ctx.translate(x, H - mb + 14);
    ctx.rotate(-Math.PI / 6);
    ctx.fillText(abreviarFecha(fechaKeys[i]), 0, 0);
    ctx.restore();
  }

  // Draw lines
  series.forEach((s, idx) => {
    const color = CHART_COLORS[idx % CHART_COLORS.length];
    const isHighlighted = _highlightIdx === idx;
    const isDimmed = _highlightIdx >= 0 && !isHighlighted;

    ctx.strokeStyle = color;
    ctx.globalAlpha = isDimmed ? 0.12 : 1;
    ctx.lineWidth = isHighlighted ? 4 : 2;
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i < s.points.length; i++) {
      const x = ml + (cw * i / (Math.max(1, fechaKeys.length - 1)));
      const y = mt + ch - (ch * s.points[i] / maxVal);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Dots
    const dotR = isHighlighted ? 5 : 3;
    for (let i = 0; i < s.points.length; i++) {
      const x = ml + (cw * i / (Math.max(1, fechaKeys.length - 1)));
      const y = mt + ch - (ch * s.points[i] / maxVal);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, dotR, 0, Math.PI * 2); ctx.fill();
    }

    // Show point values on highlighted line
    if (isHighlighted) {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px Inter, sans-serif";
      ctx.textAlign = "center";
      for (let i = 0; i < s.points.length; i++) {
        const x = ml + (cw * i / (Math.max(1, fechaKeys.length - 1)));
        const y = mt + ch - (ch * s.points[i] / maxVal);
        ctx.fillText(s.points[i], x, y - 10);
      }
    }

    ctx.globalAlpha = 1;
  });

  // Legend
  renderChartLegend();
}

function renderChartLegend() {
  const legendEl = document.getElementById("chartLegend");
  legendEl.innerHTML = _chartSeries.map((s, idx) => {
    const color = CHART_COLORS[idx % CHART_COLORS.length];
    const activeClass = _highlightIdx === idx ? "active" : (_highlightIdx >= 0 ? "dimmed" : "");
    return `<div class="chart-legend-item ${activeClass}" data-idx="${idx}">
      <span class="chart-legend-color" style="background:${color}"></span>
      ${esc(s.name)}
    </div>`;
  }).join("");

  // Click handlers on legend items
  legendEl.querySelectorAll(".chart-legend-item").forEach(item => {
    item.addEventListener("click", () => {
      const idx = parseInt(item.dataset.idx, 10);
      _highlightIdx = _highlightIdx === idx ? -1 : idx;
      drawChart();
    });
  });
}

document.getElementById("btnChart").addEventListener("click", openChart);
document.getElementById("chartClose").addEventListener("click", closeChart);
document.getElementById("chartOverlay").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeChart();
});

loadRanking();
</script>
