<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LIMA">
  <meta name="theme-color" content="#1a1d3a">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Lima FC · Prode</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:          #0b0e1f;
      --surface:     #111426;
      --surface-2:   #161a30;
      --surface-3:   #1c2140;
      --border:      #1e2444;
      --border-2:    #252c50;
      --blue:        #2E3092;
      --cyan:        #00AEEF;
      --cyan-dim:    rgba(0,174,239,0.15);
      --cyan-glow:   rgba(0,174,239,0.35);
      --text:        #edf0ff;
      --text-2:      #8a93bc;
      --text-3:      #6b7599;
      --win:         #4ade80;
      --draw:        #facc15;
      --loss:        #f87171;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bot:    env(safe-area-inset-bottom, 0px);
      --nav-h:       72px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Barlow Condensed", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--nav-h) + var(--safe-bot));
    }

    /* ── HEADER ── */
    header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      min-height: 56px;
      overflow: hidden;
      background: linear-gradient(180deg, #070a18 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }
    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% -10%, rgba(0,174,239,.18) 0%, transparent 65%);
      pointer-events: none;
    }
    header::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: .5;
    }
    .header-back {
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 22px;
      cursor: pointer;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      transition: transform .15s;
    }
    .header-back:active { transform: scale(.9); }
    .header-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: 20px;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 20px rgba(0,174,239,.2);
      position: relative;
      z-index: 1;
    }

    /* ── PRODE ── */
    .prode-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }
    .prode-header { text-align: center; margin-bottom: 22px; }
    .prode-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: 28px;
      color: var(--cyan);
      letter-spacing: 4px;
    }
    .prode-subtitle {
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 1.5px;
      margin-top: 4px;
      font-family: "Inter", system-ui, sans-serif;
    }

    /* Date group */
    .prode-date-group { margin-bottom: 20px; }
    .prode-date-label {
      font-family: "Bebas Neue", sans-serif;
      font-size: 15px;
      letter-spacing: 3px;
      color: var(--cyan);
      padding: 8px 14px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, rgba(0,174,239,.1), transparent);
      border-left: 3px solid var(--cyan);
      border-radius: 0 6px 6px 0;
    }

    /* Grid for matches */
    .prode-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 540px) {
      .prode-grid { grid-template-columns: 1fr 1fr; }
    }

    .prode-match {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .prode-team {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .prode-team.away {
      flex-direction: row-reverse;
      text-align: right;
    }
    .prode-team-name {
      font-family: "Bebas Neue", sans-serif;
      font-size: 15px;
      letter-spacing: 1.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .prode-team.away .prode-team-name { text-align: right; }
    .prode-score-input {
      width: 36px;
      height: 36px;
      text-align: center;
      font-family: "Bebas Neue", sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--cyan);
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: 8px;
      outline: none;
      flex-shrink: 0;
      -moz-appearance: textfield;
      transition: border-color .2s;
    }
    .prode-score-input::-webkit-inner-spin-button,
    .prode-score-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .prode-score-input:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,174,239,.25); }
    .prode-vs {
      font-family: "Bebas Neue", sans-serif;
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 2px;
      flex-shrink: 0;
    }
    .prode-empty {
      text-align: center;
      color: var(--text-3);
      font-size: 13px;
      padding: 40px 20px;
      letter-spacing: 1px;
    }

    /* Save button per fecha */
    .prode-fecha-footer {
      display: flex; align-items: center; gap: 12px;
      margin-top: 14px; padding: 0 2px;
    }
    .prode-save-btn {
      flex: 1; padding: 13px;
      font-family: "Bebas Neue", sans-serif; font-size: 16px;
      letter-spacing: 3px; color: #fff;
      background: linear-gradient(135deg, var(--blue), #1a1e5a);
      border: 1px solid rgba(0,174,239,.4); border-radius: 8px;
      cursor: pointer; transition: all .2s; text-align: center;
    }
    .prode-save-btn:active { transform: scale(.97); }
    .prode-save-btn:disabled {
      opacity: .35; cursor: not-allowed;
      background: var(--surface-2); border-color: var(--border-2); color: var(--text-3);
    }
    .prode-save-btn.saved {
      background: linear-gradient(135deg, #166534, #14532d);
      border-color: rgba(74,222,128,.4);
    }
    .prode-save-msg {
      font-family: "Inter", system-ui, sans-serif; font-size: 11px;
      letter-spacing: .3px; min-height: 16px; white-space: nowrap;
    }
    .prode-save-msg.ok { color: var(--win); }
    .prode-save-msg.error { color: var(--loss); }
    .prode-progress {
      font-family: "Inter", system-ui, sans-serif; font-size: 11px;
      color: var(--text-3); text-align: right; margin-top: 6px;
      letter-spacing: .3px;
    }
    .prode-progress.complete { color: var(--win); }

    /* ── AUTH OVERLAY ── */
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-overlay.hidden { display: none; }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
    }
    .auth-logo {
      font-family: "Bebas Neue", sans-serif;
      font-size: 26px;
      color: var(--cyan);
      letter-spacing: 4px;
      margin-bottom: 4px;
    }
    .auth-subtitle {
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 1.5px;
      margin-bottom: 22px;
      font-family: "Inter", system-ui, sans-serif;
    }
    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 18px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-2);
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      font-family: "Bebas Neue", sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--text-3);
      background: var(--surface-2);
      border: none;
      cursor: pointer;
      transition: all .2s;
    }
    .auth-tab.active {
      background: var(--blue);
      color: var(--cyan);
    }
    .auth-field {
      width: 100%;
      padding: 12px 14px;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: 8px;
      outline: none;
      margin-bottom: 10px;
      transition: border-color .2s;
    }
    .auth-field::placeholder { color: var(--text-3); }
    .auth-field:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,174,239,.2); }
    .auth-btn {
      width: 100%;
      padding: 13px;
      font-family: "Bebas Neue", sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #1a1e5a);
      border: 1px solid rgba(0,174,239,.4);
      border-radius: 8px;
      cursor: pointer;
      margin-top: 6px;
      transition: all .2s;
    }
    .auth-btn:active { transform: scale(.97); }
    .auth-btn:disabled { opacity: .5; cursor: not-allowed; }
    .auth-error {
      color: var(--loss);
      font-size: 12px;
      font-family: "Inter", system-ui, sans-serif;
      margin-top: 10px;
      min-height: 18px;
    }
    .auth-confirm-row { display: none; }
    .auth-confirm-row.visible { display: block; }

    /* User bar */
    .prode-user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      margin-bottom: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 12px;
    }
    .prode-user-email {
      color: var(--cyan);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .prode-logout-btn {
      background: none;
      border: 1px solid rgba(248,113,113,.3);
      color: var(--loss);
      font-family: "Bebas Neue", sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
      flex-shrink: 0;
      transition: all .15s;
    }
    .prode-logout-btn:active { background: var(--loss); color: #fff; }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-top: 1px solid rgba(0,174,239,.12);
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 50;
      height: var(--nav-h);
      padding: 10px 12px;
      padding-bottom: calc(10px + var(--safe-bot));
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .bottom-nav::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%, rgba(0,174,239,.3) 30%, rgba(0,174,239,.5) 50%, rgba(0,174,239,.3) 70%, transparent 100%
      );
    }
    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-family: "Bebas Neue", sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 14px;
      padding: 10px 8px;
      min-height: 52px;
      transition: all .22s cubic-bezier(.4,0,.2,1);
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
      color: var(--text-3);
      text-decoration: none;
    }
    .nav-tab:active { transform: scale(.96); }
    .nav-tab.active {
      background: linear-gradient(145deg, var(--blue) 0%, #1a1e5a 60%, #0e1040 100%);
      border: 1px solid rgba(0,174,239,.45);
      color: var(--cyan);
      box-shadow: 0 0 18px rgba(0,174,239,.18), 0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .nav-tab.active::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% -10%, rgba(0,174,239,.2) 0%, transparent 65%);
      pointer-events: none;
    }
    .nav-icon-svg {
      width: 22px;
      height: 22px;
      position: relative;
      z-index: 1;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), stroke .22s;
    }
    .nav-tab.active .nav-icon-svg {
      transform: scale(1.08);
      filter: drop-shadow(0 0 4px rgba(0,174,239,.5));
    }
    .nav-tab span { position: relative; z-index: 1; }

    /* ── CLOSED FECHAS ── */
    .closed-fechas-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 18px;
    }
    .closed-fechas-title {
      font-family: "Bebas Neue", sans-serif; font-size: 13px;
      letter-spacing: 3px; color: var(--text-3); margin-bottom: 10px;
      text-align: center;
    }
    .closed-fechas-grid {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    .closed-pill {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(145deg, var(--surface-2), var(--surface-3));
      border: 1.5px solid var(--border-2);
      display: flex; align-items: center; justify-content: center;
      font-family: "Bebas Neue", sans-serif; font-size: 13px;
      letter-spacing: 1px; color: var(--text-3);
      cursor: pointer; transition: all .2s; position: relative;
    }
    .closed-pill:active { transform: scale(.9); }
    .closed-pill.has-pred {
      border-color: var(--cyan); color: var(--cyan);
      background: linear-gradient(145deg, var(--surface-2), var(--surface-3));
      box-shadow: 0 0 8px rgba(0,174,239,.15);
    }
    .closed-pill.has-score {
      border-color: var(--win); color: var(--win);
      box-shadow: 0 0 8px rgba(74,222,128,.15);
    }
    .closed-pill .pill-pts {
      position: absolute; bottom: -2px; right: -4px;
      font-family: "Inter", sans-serif; font-size: 9px; font-weight: 700;
      background: var(--cyan); color: #000; border-radius: 8px;
      padding: 1px 4px; line-height: 1.2; display: none;
    }
    .closed-pill.has-score .pill-pts { display: block; background: var(--win); }

    /* ── CLOSED FECHA MODAL ── */
    .cf-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.75);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .cf-overlay.open { opacity: 1; pointer-events: auto; }
    .cf-card {
      background: var(--surface); border: 1px solid var(--border-2);
      border-radius: 14px; width: 100%; max-width: 440px;
      max-height: 85vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      overflow: hidden;
    }
    .cf-header {
      padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .cf-title {
      font-family: "Bebas Neue", sans-serif; font-size: 18px;
      letter-spacing: 3px; color: var(--cyan);
    }
    .cf-close {
      background: none; border: none; color: var(--text-3);
      font-size: 22px; cursor: pointer; padding: 4px 8px;
      line-height: 1; transition: color .2s;
    }
    .cf-close:hover { color: var(--loss); }
    .cf-summary {
      display: flex; gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-family: "Inter", sans-serif; font-size: 12px;
    }
    .cf-stat { flex: 1; text-align: center; }
    .cf-stat-val {
      font-family: "Bebas Neue", sans-serif; font-size: 20px;
      letter-spacing: 2px;
    }
    .cf-stat-label {
      font-size: 9px; letter-spacing: 1px; color: var(--text-3); margin-top: 2px;
    }
    .cf-body {
      flex: 1; overflow-y: auto; padding: 10px 12px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .cf-match {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; border-radius: 8px; margin-bottom: 6px;
      background: var(--surface-2); border: 1px solid var(--border);
    }
    .cf-team {
      font-family: "Bebas Neue", sans-serif; font-size: 13px;
      letter-spacing: 1px; color: var(--text);
      flex: 1; min-width: 0; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .cf-team.away { text-align: right; }
    .cf-scores {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; flex-shrink: 0; min-width: 54px;
    }
    .cf-pred {
      font-family: "Bebas Neue", sans-serif; font-size: 14px;
      letter-spacing: 1px; color: var(--cyan);
    }
    .cf-real {
      font-family: "Inter", sans-serif; font-size: 10px;
      color: var(--text-3); letter-spacing: .5px;
    }
    .cf-badge {
      font-family: "Bebas Neue", sans-serif; font-size: 11px;
      letter-spacing: 1px; padding: 2px 8px; border-radius: 6px;
      flex-shrink: 0; min-width: 32px; text-align: center;
    }
    .cf-badge.exact { background: rgba(0,174,239,.15); color: var(--cyan); border: 1px solid rgba(0,174,239,.3); }
    .cf-badge.ok { background: rgba(74,222,128,.12); color: var(--win); border: 1px solid rgba(74,222,128,.25); }
    .cf-badge.miss { background: rgba(248,113,113,.1); color: var(--loss); border: 1px solid rgba(248,113,113,.2); }
    .cf-badge.pending { background: var(--surface-3); color: var(--text-3); border: 1px solid var(--border); }
    .cf-no-pred {
      text-align: center; color: var(--text-3); padding: 20px;
      font-family: "Inter", sans-serif; font-size: 13px;
    }
  </style>
</head>

<body>

<!-- ── AUTH OVERLAY ── -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo">🎲 PRODE LIMA</div>
    <div class="auth-subtitle">INGRESÁ PARA JUGAR</div>
    <form id="authForm" onsubmit="return false">
      <input class="auth-field" type="email" id="authEmail" placeholder="Email" required autocomplete="email">
      <input class="auth-field" type="password" id="authPass" placeholder="Contraseña" required autocomplete="current-password" minlength="6">
      <button class="auth-btn" type="submit" id="authBtn">INGRESAR</button>
    </form>
    <div class="auth-error" id="authError"></div>
    <a href="/" style="display:block;text-align:center;margin-top:16px;color:var(--text-3);font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;text-decoration:none;transition:color .2s">← VOLVER AL INICIO</a>
  </div>
</div>

<header id="appHeader" style="display:none">
  <a href="/" class="header-back" aria-label="Volver">←</a>
  <span class="header-title">LIMA FC</span>
  <a href="/prode-admin.html" style="margin-left:auto;color:var(--text-3);font-size:18px;padding:8px;text-decoration:none;position:relative;z-index:1" title="Admin Prode">⚙️</a>
</header>

<div class="prode-content" id="prodeContent" style="display:none">
  <div class="prode-user-bar" id="userBar">
    <span class="prode-user-email" id="userEmail"></span>
    <button class="prode-logout-btn" onclick="doLogout()">SALIR</button>
  </div>
  <div class="prode-header">
    <div class="prode-title">🎲 PRODE</div>
    <div class="prode-subtitle">INGRESÁ TU PRONÓSTICO · JUNIOR APERTURA 2026</div>
  </div>
  <div id="prodeList">
    <div class="prode-empty" id="prodeEmpty">Cargando fechas...</div>
  </div>
</div>

<!-- Closed fecha modal -->
<div class="cf-overlay" id="cfOverlay">
  <div class="cf-card">
    <div class="cf-header">
      <span class="cf-title" id="cfTitle">FECHA 1</span>
      <button class="cf-close" id="cfClose">&times;</button>
    </div>
    <div class="cf-summary" id="cfSummary"></div>
    <div class="cf-body" id="cfBody"></div>
  </div>
</div>

<!-- ── BOTTOM NAV ── -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import { USE_MOCK, firebaseConfig } from "./config.js";

// ── Mock implementations ──
const MOCK_USER = { email: "lima@gmail.com", password: "123456", uid: "mock-user-1" };
let _mockAuthCallback = null;

const mockAuth = {
  currentUser: null,
  _notify() { if (_mockAuthCallback) _mockAuthCallback(this.currentUser); }
};

function mockSignIn(auth, email, pass) {
  return new Promise((resolve, reject) => {
    if (email === MOCK_USER.email && pass === MOCK_USER.password) {
      const user = { uid: MOCK_USER.uid, email };
      mockAuth.currentUser = user;
      localStorage.setItem("mockSession", JSON.stringify(user));
      mockAuth._notify();
      resolve({ user });
    } else {
      reject({ code: "auth/invalid-credential" });
    }
  });
}
function mockSignOut() {
  mockAuth.currentUser = null;
  localStorage.removeItem("mockSession");
  mockAuth._notify();
}
function mockOnAuthStateChanged(auth, cb) {
  _mockAuthCallback = cb;
  const saved = JSON.parse(localStorage.getItem("mockSession") || "null");
  if (saved) { mockAuth.currentUser = saved; }
  setTimeout(() => cb(mockAuth.currentUser), 0);
}
function mockDbSet(refPath, data) {
  // Route by path prefix
  if (refPath.startsWith("lima/prode/fechas")) {
    const store = JSON.parse(localStorage.getItem("prodeFechas") || "{}");
    const key = refPath.split("/").pop();
    store[key] = data;
    localStorage.setItem("prodeFechas", JSON.stringify(store));
  } else if (refPath.includes("/predictions/")) {
    localStorage.setItem("mockProde_" + refPath.replace(/\//g, "_"), JSON.stringify(data));
  } else if (refPath.startsWith("lima/usuarios")) {
    const store = JSON.parse(localStorage.getItem("limaUsers") || "{}");
    const key = refPath.split("/").pop();
    store[key] = data;
    localStorage.setItem("limaUsers", JSON.stringify(store));
  } else {
    localStorage.setItem("mock_" + refPath.replace(/\//g, "_"), JSON.stringify(data));
  }
  return Promise.resolve();
}
function mockDbGet(refPath) {
  if (refPath === "lima/prode/fechas") {
    const store = JSON.parse(localStorage.getItem("prodeFechas") || "{}");
    return Promise.resolve({ val: () => Object.keys(store).length ? store : null });
  }
  if (refPath.startsWith("lima/prode/fechas/")) {
    const store = JSON.parse(localStorage.getItem("prodeFechas") || "{}");
    const key = refPath.split("/").pop();
    return Promise.resolve({ val: () => store[key] || null });
  }
  if (refPath.includes("/predictions/")) {
    const data = JSON.parse(localStorage.getItem("mockProde_" + refPath.replace(/\//g, "_")) || "null");
    return Promise.resolve({ val: () => data });
  }
  if (refPath.startsWith("lima/usuarios")) {
    const store = JSON.parse(localStorage.getItem("limaUsers") || "{}");
    if (refPath === "lima/usuarios") {
      return Promise.resolve({ val: () => Object.keys(store).length ? store : null });
    }
    const key = refPath.split("/").pop();
    return Promise.resolve({ val: () => store[key] || null });
  }
  return Promise.resolve({ val: () => null });
}
function mockRef(db, path) { return path; }

// ── Init real or mock ──
let fbApp, auth, db;
let _signIn, _signOutFn, _onAuth, _dbSet, _dbGet, _dbRef;

if (!USE_MOCK) {
  fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  await setPersistence(auth, browserSessionPersistence);
  db = getDatabase(fbApp);
  _signIn = signInWithEmailAndPassword;
  _signOutFn = signOut;
  _onAuth = onAuthStateChanged;
  _dbSet = set;
  _dbGet = get;
  _dbRef = ref;
} else {
  console.log("%c[MOCK MODE] Firebase deshabilitado — usando datos locales", "color:#00AEEF;font-weight:bold");
  auth = mockAuth;
  db = null;
  _signIn = mockSignIn;
  _signOutFn = () => mockSignOut();
  _onAuth = mockOnAuthStateChanged;
  _dbSet = (r, data) => mockDbSet(r, data);
  _dbGet = (r) => mockDbGet(r);
  _dbRef = mockRef;
}

let currentUser = null;
function showAuthError(msg) {
  document.getElementById("authError").textContent = msg;
}

function setAuthLoading(loading) {
  document.getElementById("authBtn").disabled = loading;
  document.getElementById("authBtn").textContent = loading ? "..." : "INGRESAR";
}

// ── Auth form submit ──
document.getElementById("authForm").addEventListener("submit", async () => {
  const email = document.getElementById("authEmail").value.trim();
  const pass = document.getElementById("authPass").value;
  showAuthError("");

  if (!email || !pass) { showAuthError("Completá todos los campos"); return; }
  if (pass.length < 6) { showAuthError("La contraseña debe tener al menos 6 caracteres"); return; }

  setAuthLoading(true);
  try {
    await _signIn(auth, email, pass);
  } catch (err) {
    const msgs = {
      "auth/invalid-email": "Email inválido",
      "auth/user-not-found": "Usuario no encontrado",
      "auth/wrong-password": "Contraseña incorrecta",
      "auth/invalid-credential": "Email o contraseña incorrectos",
      "auth/too-many-requests": "Demasiados intentos. Intentá más tarde",
    };
    showAuthError(msgs[err.code] || "Error: " + err.message);
  } finally {
    setAuthLoading(false);
  }
});

// ── Logout ──
function doLogout() {
  _signOutFn(auth);
}
window.doLogout = doLogout;

// ── Auth state listener ──
_onAuth(auth, async (user) => {
  currentUser = user;
  if (user && user.email) {
    document.getElementById("authOverlay").classList.add("hidden");
    document.getElementById("prodeContent").style.display = "";
    document.getElementById("appHeader").style.display = "";
    document.getElementById("appNav").style.display = "";
    document.getElementById("userEmail").textContent = user.email;
    await loadActiveFechas();
    await loadAllUserPredictions();
  } else {
    if (user) _signOutFn(auth); // sesión inválida/incompleta, forzar logout
    currentUser = null;
    document.getElementById("authOverlay").classList.remove("hidden");
    document.getElementById("prodeContent").style.display = "none";
    document.getElementById("appHeader").style.display = "none";
    document.getElementById("appNav").style.display = "none";
  }
});

// ── Dynamic fechas rendering ──
let activeFechas = {}; // { "2": { numero, groups, ... }, ... }
let closedFechas = {}; // inactive fechas
let closedPredictions = {}; // user predictions for closed fechas
let scoringData = null; // scoring data for current user

function slugify(s) {
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

async function loadActiveFechas() {
  const container = document.getElementById("prodeList");
  try {
    const snap = await _dbGet(_dbRef(db, "lima/prode/fechas"));
    const all = snap.val();
    if (!all) {
      container.innerHTML = '<div class="prode-empty">No hay fechas disponibles</div>';
      return;
    }

    activeFechas = {};
    closedFechas = {};
    const allEntries = Object.entries(all).sort((a, b) => Number(a[0]) - Number(b[0]));

    for (const [key, fecha] of allEntries) {
      if (fecha.active !== false) {
        activeFechas[key] = fecha;
      } else {
        closedFechas[key] = fecha;
      }
    }

    // Render active fechas
    const sorted = Object.entries(activeFechas).sort((a, b) => Number(a[0]) - Number(b[0]));

    if (sorted.length === 0) {
      container.innerHTML = '<div class="prode-empty">No hay fechas activas</div>';
      return;
    }

    let html = "";
    for (const [key, fecha] of sorted) {
      activeFechas[key] = fecha;
      let matchCount = 0;
      for (const group of (fecha.groups || [])) {
        html += `<div class="prode-date-group">`;
        html += `<div class="prode-date-label">📅 FECHA ${fecha.numero} — ${esc(group.date)}</div>`;
        html += `<div class="prode-grid">`;
        for (const m of group.matches) {
          matchCount++;
          const mid = slugify(m.home) + "_" + slugify(m.away);
          html += `<div class="prode-match" data-fecha="${key}" data-match="${mid}">`;
          html += `<div class="prode-team home"><span class="prode-team-name">${esc(m.home)}</span>`;
          html += `<input class="prode-score-input" data-side="home" type="number" min="0" max="20" inputmode="numeric" placeholder="-"></div>`;
          html += `<span class="prode-vs">VS</span>`;
          html += `<div class="prode-team away"><span class="prode-team-name">${esc(m.away)}</span>`;
          html += `<input class="prode-score-input" data-side="away" type="number" min="0" max="20" inputmode="numeric" placeholder="-"></div>`;
          html += `</div>`;
        }
        html += `</div></div>`;
      }
      // Footer with progress + save button per fecha
      const totalInputs = matchCount * 2;
      html += `<div class="prode-fecha-footer" id="footer_${key}">`;
      html += `<div style="flex:1">`;
      html += `<div class="prode-progress" id="progress_${key}">0 / ${totalInputs} completados</div>`;
      html += `<div class="prode-save-msg" id="saveMsg_${key}"></div>`;
      html += `</div>`;
      html += `<button class="prode-save-btn" id="saveBtn_${key}" disabled onclick="doSaveFecha('${key}')">GUARDAR FECHA ${fecha.numero}</button>`;
      html += `</div>`;
    }
    container.innerHTML = html;
  } catch (e) {
    console.error("Error loading fechas:", e);
    container.innerHTML = '<div class="prode-empty">Error cargando fechas</div>';
  }
}

// ── Save/Load predictions per user per fecha ──
async function loadAllUserPredictions() {
  if (!currentUser) return;

  // Load active fecha predictions (fill inputs)
  for (const key of Object.keys(activeFechas)) {
    try {
      const snap = await _dbGet(_dbRef(db, `lima/prode/predictions/${currentUser.uid}/${key}`));
      const data = snap.val();
      if (!data) { updateFechaProgress(key); continue; }
      const matchEls = document.querySelectorAll(`.prode-match[data-fecha="${key}"]`);
      for (const el of matchEls) {
        const mid = el.dataset.match;
        if (data[mid]) {
          const homeInput = el.querySelector('[data-side="home"]');
          const awayInput = el.querySelector('[data-side="away"]');
          if (homeInput && data[mid].home != null) homeInput.value = data[mid].home;
          if (awayInput && data[mid].away != null) awayInput.value = data[mid].away;
        }
      }
      updateFechaProgress(key);
    } catch (e) { console.error(`Error loading predictions fecha ${key}:`, e); }
  }

  // Load closed fecha predictions + scoring
  closedPredictions = {};
  try {
    const [scoringSnap] = await Promise.allSettled([
      _dbGet(_dbRef(db, `lima/prode/scoring/${currentUser.uid}`))
    ]);
    scoringData = scoringSnap.status === "fulfilled" ? scoringSnap.value.val() : null;
  } catch (e) { scoringData = null; }

  for (const key of Object.keys(closedFechas)) {
    try {
      const snap = await _dbGet(_dbRef(db, `lima/prode/predictions/${currentUser.uid}/${key}`));
      closedPredictions[key] = snap.val();
    } catch (e) { closedPredictions[key] = null; }
  }

  renderClosedFechas();
}

// ═══════════════════════════════════════════
// CLOSED FECHAS PILLS + MODAL
// ═══════════════════════════════════════════
function renderClosedFechas() {
  const closedKeys = Object.keys(closedFechas).sort((a, b) => Number(a) - Number(b));
  // Remove existing container if present
  const existing = document.getElementById("closedFechasBox");
  if (existing) existing.remove();

  if (closedKeys.length === 0) return;

  // Insert container before prodeList
  const container = document.createElement("div");
  container.id = "closedFechasBox";
  container.className = "closed-fechas-box";

  let html = '<div class="closed-fechas-title">📋 FECHAS ANTERIORES</div>';
  html += '<div class="closed-fechas-grid">';
  for (const key of closedKeys) {
    const fecha = closedFechas[key];
    const hasPred = closedPredictions[key] && Object.keys(closedPredictions[key]).filter(k => !k.startsWith("_")).length > 0;
    const userPts = scoringData && scoringData.fechas && scoringData.fechas[key] ? scoringData.fechas[key].puntos : null;
    const hasScore = userPts != null;
    const cls = hasScore ? "has-score" : hasPred ? "has-pred" : "";
    html += `<button class="closed-pill ${cls}" data-fecha="${esc(key)}" title="Fecha ${esc(key)}">`;
    html += `F${esc(key)}`;
    if (hasScore) html += `<span class="pill-pts">${userPts}</span>`;
    html += `</button>`;
  }
  html += '</div>';
  container.innerHTML = html;

  const prodeList = document.getElementById("prodeList");
  prodeList.parentNode.insertBefore(container, prodeList);

  // Click handlers
  container.querySelectorAll(".closed-pill").forEach(btn => {
    btn.addEventListener("click", () => openClosedFechaModal(btn.dataset.fecha));
  });
}

function openClosedFechaModal(fechaKey) {
  const fecha = closedFechas[fechaKey];
  if (!fecha) return;
  const preds = closedPredictions[fechaKey] || {};
  const userScore = scoringData && scoringData.fechas && scoringData.fechas[fechaKey] ? scoringData.fechas[fechaKey] : null;

  document.getElementById("cfTitle").textContent = `FECHA ${fecha.numero}`;

  // Count matches and results
  let totalMatches = 0, playedMatches = 0, predMatches = 0;
  let totalPts = userScore ? userScore.puntos : 0;
  let totalAciertos = userScore ? userScore.aciertos : 0;
  let totalExactos = userScore ? userScore.exactos : 0;

  // Build match list
  let bodyHtml = "";
  for (const group of (fecha.groups || [])) {
    bodyHtml += `<div style="font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;color:var(--text-3);padding:6px 4px 4px;margin-top:4px">${esc(group.date)}</div>`;
    for (const m of group.matches) {
      totalMatches++;
      const mid = slugify(m.home) + "_" + slugify(m.away);
      const pred = preds[mid];
      const hasResult = m.homeScore != null && m.awayScore != null;
      if (hasResult) playedMatches++;
      const hasPred = pred && pred.home != null && pred.away != null;
      if (hasPred) predMatches++;

      // Calculate badge
      let badgeCls = "pending", badgeText = "—";
      if (hasPred && hasResult) {
        const realOutcome = m.homeScore > m.awayScore ? "H" : m.homeScore < m.awayScore ? "A" : "D";
        const predOutcome = pred.home > pred.away ? "H" : pred.home < pred.away ? "A" : "D";
        if (pred.home === m.homeScore && pred.away === m.awayScore) {
          badgeCls = "exact"; badgeText = "+4";
        } else if (realOutcome === predOutcome) {
          badgeCls = "ok"; badgeText = "+1";
        } else {
          badgeCls = "miss"; badgeText = "0";
        }
      } else if (hasPred && !hasResult) {
        badgeCls = "pending"; badgeText = "⏳";
      } else if (!hasPred) {
        badgeCls = "pending"; badgeText = "—";
      }

      bodyHtml += `<div class="cf-match">`;
      bodyHtml += `<span class="cf-team">${esc(m.home)}</span>`;
      bodyHtml += `<div class="cf-scores">`;
      if (hasPred) {
        bodyHtml += `<span class="cf-pred">${pred.home} - ${pred.away}</span>`;
      } else {
        bodyHtml += `<span class="cf-pred" style="color:var(--text-3)">— - —</span>`;
      }
      if (hasResult) {
        bodyHtml += `<span class="cf-real">Real: ${m.homeScore} - ${m.awayScore}</span>`;
      }
      bodyHtml += `</div>`;
      bodyHtml += `<span class="cf-team away">${esc(m.away)}</span>`;
      bodyHtml += `<span class="cf-badge ${badgeCls}">${badgeText}</span>`;
      bodyHtml += `</div>`;
    }
  }

  if (totalMatches === 0) {
    bodyHtml = '<div class="cf-no-pred">Sin datos para esta fecha</div>';
  }

  document.getElementById("cfBody").innerHTML = bodyHtml;

  // Summary
  document.getElementById("cfSummary").innerHTML = `
    <div class="cf-stat">
      <div class="cf-stat-val" style="color:var(--cyan)">${totalPts}</div>
      <div class="cf-stat-label">PUNTOS</div>
    </div>
    <div class="cf-stat">
      <div class="cf-stat-val" style="color:var(--win)">${totalAciertos}</div>
      <div class="cf-stat-label">ACIERTOS</div>
    </div>
    <div class="cf-stat">
      <div class="cf-stat-val" style="color:var(--cyan)">${totalExactos}</div>
      <div class="cf-stat-label">EXACTOS</div>
    </div>
    <div class="cf-stat">
      <div class="cf-stat-val" style="color:var(--text-2)">${playedMatches}/${totalMatches}</div>
      <div class="cf-stat-label">JUGADOS</div>
    </div>`;

  document.getElementById("cfOverlay").classList.add("open");
}

function closeClosedModal() {
  document.getElementById("cfOverlay").classList.remove("open");
}
document.getElementById("cfClose").addEventListener("click", closeClosedModal);
document.getElementById("cfOverlay").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeClosedModal();
});

// ── Validate & progress per fecha ──
function getFechaInputs(fechaKey) {
  return document.querySelectorAll(`.prode-match[data-fecha="${fechaKey}"] .prode-score-input`);
}

function updateFechaProgress(fechaKey) {
  const inputs = getFechaInputs(fechaKey);
  const total = inputs.length;
  let filled = 0;
  let allValid = true;
  for (const inp of inputs) {
    const v = inp.value.trim();
    if (v !== "" && !isNaN(v)) {
      const n = parseInt(v, 10);
      if (n >= 0 && n <= 20) { filled++; } else { allValid = false; }
    } else if (v !== "") {
      allValid = false;
    }
  }
  const complete = filled === total && allValid && total > 0;

  const progressEl = document.getElementById("progress_" + fechaKey);
  const btn = document.getElementById("saveBtn_" + fechaKey);
  if (progressEl) {
    progressEl.textContent = `${filled} / ${total} completados`;
    progressEl.className = "prode-progress" + (complete ? " complete" : "");
  }
  if (btn) {
    btn.disabled = !complete;
  }
  return complete;
}

// ── Explicit save per fecha ──
async function doSaveFecha(fechaKey) {
  if (!currentUser) return;
  if (!updateFechaProgress(fechaKey)) return;

  const btn = document.getElementById("saveBtn_" + fechaKey);
  const msgEl = document.getElementById("saveMsg_" + fechaKey);
  btn.disabled = true;
  btn.textContent = "VERIFICANDO...";

  // Re-check that the fecha is still active before saving
  try {
    const fechaSnap = await _dbGet(_dbRef(db, `lima/prode/fechas/${fechaKey}`));
    const fechaData = fechaSnap.val();
    if (!fechaData || fechaData.active === false) {
      if (msgEl) { msgEl.textContent = "⚠ Esta fecha fue desactivada por el admin"; msgEl.className = "prode-save-msg error"; }
      btn.textContent = "FECHA CERRADA";
      btn.disabled = true;
      return;
    }
  } catch (e) {
    console.error("Error checking fecha status:", e);
    if (msgEl) { msgEl.textContent = "Error al verificar estado de la fecha"; msgEl.className = "prode-save-msg error"; }
    btn.textContent = `GUARDAR FECHA ${activeFechas[fechaKey]?.numero || fechaKey}`;
    updateFechaProgress(fechaKey);
    return;
  }

  btn.textContent = "GUARDANDO...";

  const matchEls = document.querySelectorAll(`.prode-match[data-fecha="${fechaKey}"]`);
  const data = {};
  for (const el of matchEls) {
    const mid = el.dataset.match;
    const h = el.querySelector('[data-side="home"]').value;
    const a = el.querySelector('[data-side="away"]').value;
    data[mid] = {
      home: parseInt(h, 10),
      away: parseInt(a, 10)
    };
  }

  try {
    await _dbSet(_dbRef(db, `lima/prode/predictions/${currentUser.uid}/${fechaKey}`), data);
    // Also save email and nombre for scoring lookup
    await _dbSet(_dbRef(db, `lima/prode/predictions/${currentUser.uid}/_email`), currentUser.email);
    // Try to get nombre from usuarios
    try {
      const emailKey = currentUser.email.toLowerCase().replace(/[^a-z0-9]/g, "_");
      const uSnap = await _dbGet(_dbRef(db, `lima/usuarios/${emailKey}`));
      const uData = uSnap.val();
      if (uData && uData.nombre) {
        await _dbSet(_dbRef(db, `lima/prode/predictions/${currentUser.uid}/_nombre`), uData.nombre);
      }
    } catch(e) { /* ignore */ }
    if (msgEl) { msgEl.textContent = "✓ Guardado correctamente"; msgEl.className = "prode-save-msg ok"; }
    btn.textContent = "✓ GUARDADO";
    btn.classList.add("saved");
    setTimeout(() => {
      const fecha = activeFechas[fechaKey];
      btn.textContent = `GUARDAR FECHA ${fecha ? fecha.numero : fechaKey}`;
      btn.classList.remove("saved");
      updateFechaProgress(fechaKey);
    }, 2000);
  } catch (e) {
    console.error(`Error saving predictions fecha ${fechaKey}:`, e);
    if (msgEl) { msgEl.textContent = "Error al guardar"; msgEl.className = "prode-save-msg error"; }
    btn.textContent = `GUARDAR FECHA ${activeFechas[fechaKey]?.numero || fechaKey}`;
    updateFechaProgress(fechaKey);
  }
}
window.doSaveFecha = doSaveFecha;

// ── Input change: validate + update progress (no auto-save) ──
document.getElementById("prodeList").addEventListener("input", (e) => {
  if (!e.target.classList.contains("prode-score-input")) return;
  let v = parseInt(e.target.value, 10);
  if (v < 0) e.target.value = 0;
  if (v > 20) e.target.value = 20;
  const matchEl = e.target.closest(".prode-match");
  if (!matchEl) return;
  const fechaKey = matchEl.dataset.fecha;
  updateFechaProgress(fechaKey);
  // Clear saved message when editing
  const msgEl = document.getElementById("saveMsg_" + fechaKey);
  if (msgEl) { msgEl.textContent = ""; msgEl.className = "prode-save-msg"; }
  const btn = document.getElementById("saveBtn_" + fechaKey);
  if (btn) btn.classList.remove("saved");
});
</script>
</body>
</html>
